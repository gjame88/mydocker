name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker 빌드 & 푸시
        run: |
          IMAGE="jaekukang/my-web-app:${{ github.sha }}"
          docker build -f docker/Dockerfile -t $IMAGE .
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push $IMAGE

      - name: 매니페스트 저장소 업데이트
        run: |
          git clone https://x-access-token:${{ secrets.GIT_MANIFEST_TOKEN }}@github.com/jaekukang/my-app-manifest.git
          cd my-app-manifest
          
          # 경로 수정: k8s/ 가 아니라 myk8s/ 일 가능성이 높습니다.
          sed -i "s|image: .*|image: jaekukang/my-web-app:${{ github.sha }}|g" myk8s/deployment.yaml
          
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add myk8s/deployment.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update image: ${{ github.sha }}" && git push)