name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker 빌드 & 푸시
        run: |
          IMAGE="jaekukang/my-web-app:${{ github.sha }}"
          docker build -f docker/Dockerfile -t $IMAGE .
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push $IMAGE

      - name: 매니페스트 저장소 업데이트 (GitOps)
        run: |
          # 1. 매니페스트 저장소 복제
          git clone https://x-access-token:${{ secrets.GIT_MANIFEST_TOKEN }}@github.com/jaekukang/my-app-manifest.git
          cd my-app-manifest
          
          # 2. 이미지 태그 업데이트 (이미지 경로를 정확하게 타겟팅)
          sed -i "s|image: .*|image: jaekukang/my-web-app:${{ github.sha }}|g" k8s/deployment.yaml
          
          # 3. 변경사항 커밋 및 푸시
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add k8s/deployment.yaml
          
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update image: ${{ github.sha }}" && git push)